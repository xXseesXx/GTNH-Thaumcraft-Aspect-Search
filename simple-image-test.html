<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Image Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #FF0000;
            font-family: monospace;
        }
        canvas {
            border: 5px solid #000;
            display: block;
            margin: 20px auto;
            background: #FFFF00;
        }
        #log {
            background: #000;
            color: #0f0;
            padding: 20px;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🧪 Ultra-Simple Image Draw Test</h1>
    <canvas id="testCanvas" width="800" height="600"></canvas>
    <div id="log">Initializing...\n</div>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const logEl = document.getElementById('log');
        
        function log(msg) {
            logEl.textContent += msg + '\n';
            console.log(msg);
        }

        async function testDraw() {
            try {
                log('Starting test...');
                
                // Fill background
                ctx.fillStyle = '#FFFF00';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                log('✅ Canvas filled with yellow');
                
                // Try to load ONE image
                log('Loading aer.png...');
                const img = new Image();
                img.src = 'aspect_images/aer.png';
                
                await new Promise((resolve, reject) => {
                    img.onload = () => {
                        log(`✅ Image loaded! Size: ${img.width}x${img.height}`);
                        resolve();
                    };
                    img.onerror = (e) => {
                        log(`❌ Failed to load image: ${e}`);
                        reject(e);
                    };
                    setTimeout(() => reject(new Error('Timeout')), 5000);
                });
                
                // Draw it BIG in the center
                const size = 300;
                const x = canvas.width / 2 - size / 2;
                const y = canvas.height / 2 - size / 2;
                
                log(`Drawing at ${x}, ${y}, size ${size}x${size}`);
                ctx.drawImage(img, x, y, size, size);
                log('✅ Image drawn!');
                
                // Draw a border
                ctx.strokeStyle = '#FF00FF';
                ctx.lineWidth = 5;
                ctx.strokeRect(x, y, size, size);
                log('✅ Border drawn!');
                
                // Draw some text
                ctx.fillStyle = '#000';
                ctx.font = 'bold 30px Arial';
                ctx.fillText('Image should be above this text', 50, 550);
                
                log('✅ TEST COMPLETE! You should see a large aspect icon in the center.');
                
            } catch (error) {
                log(`❌ ERROR: ${error.message}`);
            }
        }
        
        testDraw();
    </script>
</body>
</html>
